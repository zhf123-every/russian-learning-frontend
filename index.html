<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#F5F0EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Russian Learning</title>
  <style>
    /* 首屏加载动画，JS加载完成前显示 */
    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #F5F0EB;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app-loading .icon {
      font-size: 56px;
      margin-bottom: 16px;
      animation: loadingFloat 1.5s ease-in-out infinite;
    }
    #app-loading .text {
      font-size: 18px;
      font-weight: 600;
      color: #3D332C;
      margin-bottom: 12px;
    }
    #app-loading .dots {
      display: flex;
      gap: 6px;
    }
    #app-loading .dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9B7B5E;
      animation: dotBounce 1.4s infinite ease-in-out both;
    }
    #app-loading .dots span:nth-child(1) { animation-delay: -0.32s; }
    #app-loading .dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes loadingFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- JS加载完成前显示的加载动画 -->
    <div id="app-loading">
      <div class="icon">📖</div>
      <div class="text">Russian Learning</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </div>
  <noscript>
    <div style="padding:40px;text-align:center;font-family:sans-serif;background:#F5F0EB;color:#3D332C;min-height:100vh">
      <h1>需要启用 JavaScript</h1>
      <p>请在浏览器设置中启用 JavaScript 后刷新页面。</p>
    </div>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // React挂载后移除加载动画
    window.addEventListener('load', function() {
      setTimeout(function() {
        var loading = document.getElementById('app-loading');
        if (loading) {
          loading.style.transition = 'opacity 0.3s';
          loading.style.opacity = '0';
          setTimeout(function() { loading.remove(); }, 300);
        }
      }, 300);
    });
  </script>
</body>
</html>
